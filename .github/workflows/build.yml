name: Applis Windows et Android

# Construit PerfManager-Setup.exe (Windows) et PerfDeck.apk (Android),
# puis les publie dans une Release du dépôt.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:   # lancement manuel : onglet Actions → Run workflow

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils Android (sans Gradle)
        run: sudo apt-get update -q && sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner android-sdk-platform-23
      # Clé de signature : secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD (les mises à jour
      # s'installent alors par-dessus) ; sinon build.sh crée une clé temporaire pour ce build.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/perfdeck.jks
            echo "PERFDECK_KEY_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret de signature : clé temporaire (désinstaller l'ancienne appli avant de mettre à jour)."
          fi
      - name: Construire l'APK
        run: PERFDECK_VERSION="1.0.${{ github.run_number }}" bash android/build.sh
      - name: Renommer
        run: cp android/dist/PerfDeck.apk PerfDeck.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PerfDeck.apk

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire PerfManager.exe et l'installateur
        shell: pwsh
        run: ./windows/build.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PerfManager-Setup.exe

  release:
    name: Publier la Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PerfManager 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/PerfDeck.apk
            out/PerfManager-Setup.exe
          body: |
            **PerfManager-Setup.exe** : à installer sur le PC (Windows 10/11). Icône près de l'horloge : clic droit pour les profils, le téléphone et les mises à jour.

            **PerfDeck.apk** : à ouvrir sur le téléphone Android (autoriser l'installation depuis le navigateur), puis scanner le QR code du PC.
